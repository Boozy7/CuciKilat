services:
  app:
    image: boozy7/cucikilat:latest
    container_name: cucikilat-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: "${APP_NAME:-CuciKilat}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY wajib diset di file .env}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-cucikilat}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME wajib diset di file .env}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD wajib diset di file .env}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - public_net
      - backend

  db:
    image: mysql:8.0
    container_name: cucikilat-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-cucikilat}"
      MYSQL_USER: "${DB_USERNAME:?DB_USERNAME wajib diset di file .env}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD wajib diset di file .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diset di file .env}"
    volumes:
      - cucikilat_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

volumes:
  cucikilat_db_data:
    driver: local

networks:
  public_net:
    driver: bridge
  backend:
    driver: bridge
    internal: true
